<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ProPresenter Stage Confidence Monitor</title>
  <link rel="icon" type="image/jpg" href="../src/Propresenter.jpg">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Floating Controls Bar */
    .stage-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 100;
    }
    body:hover .stage-top-bar, .stage-top-bar:focus-within {
      opacity: 1;
    }

    /* Main Monitor Layout */
    .monitor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
      gap: 14px;
      height: 100vh;
      box-sizing: border-box;
    }

    /* Current Slide Container (Primary) */
    .current-slide-panel {
      flex: 5.5;
      background: #0d0e12;
      border: 3px solid #ffb300;
      border-radius: var(--radius-lg);
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(255, 179, 0, 0.15);
    }
    .panel-label {
      position: absolute;
      top: 10px;
      left: 16px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffb300;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .slide-main-text {
      font-size: clamp(28px, 5.5vw, 68px);
      font-weight: 800;
      line-height: 1.35;
      color: #ffffff;
      white-space: pre-wrap;
      word-break: break-word;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      max-height: 100%;
      overflow-y: auto;
    }

    /* Next Slide Container (Preview) */
    .next-slide-panel {
      flex: 3.5;
      background: #090a0d;
      border: 2px solid #38bdf8;
      border-radius: var(--radius-md);
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .panel-label-next {
      position: absolute;
      top: 8px;
      left: 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #38bdf8;
    }
    .slide-next-text {
      font-size: clamp(20px, 3.6vw, 42px);
      font-weight: 600;
      line-height: 1.35;
      color: #94a3b8;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 100%;
      overflow-y: auto;
    }

    /* Footer: Stage Message + Timers */
    .monitor-footer {
      flex: 1.2;
      display: flex;
      gap: 14px;
      min-height: 60px;
    }
    .stage-msg-box {
      flex: 1;
      background: #181015;
      border: 2px solid #ef4444;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      padding: 10px 20px;
      gap: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .stage-msg-box.has-message {
      background: #2b0d12;
      border-color: #ff334b;
      box-shadow: 0 0 20px rgba(255, 51, 75, 0.4);
      animation: alert-pulse 1.8s infinite;
    }
    .stage-msg-content {
      font-size: clamp(16px, 2.5vw, 28px);
      font-weight: 700;
      color: #ff4d6d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @keyframes alert-pulse {
      0% { border-color: #ff334b; }
      50% { border-color: #ffd700; }
      100% { border-color: #ff334b; }
    }

    .time-box {
      background: #11141b;
      border: 2px solid #262c3b;
      border-radius: var(--radius-md);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: clamp(18px, 2.8vw, 32px);
      font-weight: 700;
      color: #ffb300;
      white-space: nowrap;
    }
    .countdown-indicator {
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Status Pill */
    .live-status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
    }

    /* QR Code Modal */
    .qr-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }
    .qr-box {
      background: #181a20;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
  </style>
</head>
<body>

  <!-- Floating Bar for Operator Controls -->
  <div class="stage-top-bar" id="stageTopBar">
    <div class="d-flex align-items-center gap-3">
      <span class="live-status-pill" id="streamStatusPill">
        <span class="live-dot" id="streamDot"></span>
        <span id="streamStatusText">Connecting...</span>
      </span>
      <span class="text-secondary small font-mono" id="serverInfoText">ProPresenter 7</span>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button class="btn-studio btn-icon-only" id="fontDecBtn" title="Decrease Font Size"><i class="fas fa-minus"></i></button>
      <button class="btn-studio btn-icon-only" id="fontIncBtn" title="Increase Font Size"><i class="fas fa-plus"></i></button>
      <button class="btn-studio btn-icon-only" id="qrBtn" title="Share Mobile QR Code"><i class="fas fa-qrcode"></i></button>
      <button class="btn-studio btn-icon-only" id="fullscreenBtn" title="Toggle Fullscreen"><i class="fas fa-expand"></i></button>
      <a href="index.html" class="btn-studio btn-studio-orange text-decoration-none"><i class="fas fa-sliders-h"></i> Controller</a>
    </div>
  </div>

  <!-- Stage Confidence Monitor View -->
  <div class="monitor-container">
    
    <!-- Current Live Slide Text -->
    <div class="current-slide-panel" id="currentSlidePanel">
      <div class="panel-label">
        <i class="fas fa-play text-orange"></i> CURRENT SLIDE
        <span id="slideIndexBadge" class="badge-prop badge-orange ms-2">LIVE</span>
      </div>
      <div class="slide-main-text" id="currentSlideText">Connecting to ProPresenter...</div>
    </div>

    <!-- Next Slide Preview -->
    <div class="next-slide-panel" id="nextSlidePanel">
      <div class="panel-label-next">
        <i class="fas fa-forward text-cyan"></i> NEXT SLIDE
      </div>
      <div class="slide-next-text" id="nextSlideText">--</div>
    </div>

    <!-- Footer: Stage Message & Clocks -->
    <div class="monitor-footer">
      <div class="stage-msg-box" id="stageMessageBox">
        <i class="fas fa-bullhorn text-danger fs-4"></i>
        <div class="stage-msg-content" id="stageMessageText">No active stage message</div>
      </div>

      <div class="time-box">
        <div class="countdown-indicator" id="videoCountdownBox" style="display: none;">
          <i class="fas fa-film"></i>
          <span id="videoCountdownVal">00:00</span>
        </div>
        <div id="clockDisplay">12:00:00 AM</div>
      </div>
    </div>

  </div>

  <!-- QR Code Modal -->
  <div class="qr-modal" id="qrModal">
    <div class="qr-box">
      <h5 class="text-orange mb-3"><i class="fas fa-qrcode"></i> Scan for Stage Monitor</h5>
      <div id="qrcodeDisplay" class="d-flex justify-content-center p-3 bg-black rounded mb-3"></div>
      <p class="text-secondary small mb-3">Musicians, singers, and speakers can view this monitor on their smartphone or iPad.</p>
      <button class="btn-studio w-100" id="closeQrBtn">Close</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/api/api-client.js"></script>
  <script src="../js/api/stream-client.js"></script>
  <script src="../js/state/store.js"></script>

  <script>
    // --- STAGE MONITOR SCRIPT ---
    const config = AppConfig.getConfig();
    const apiClient = new ApiClient(config.baseURL);
    const store = new StateStore();

    // DOM Elements
    const currentSlideText = document.getElementById('currentSlideText');
    const nextSlideText = document.getElementById('nextSlideText');
    const slideIndexBadge = document.getElementById('slideIndexBadge');
    const stageMessageBox = document.getElementById('stageMessageBox');
    const stageMessageText = document.getElementById('stageMessageText');
    const clockDisplay = document.getElementById('clockDisplay');
    const videoCountdownBox = document.getElementById('videoCountdownBox');
    const videoCountdownVal = document.getElementById('videoCountdownVal');
    const streamStatusPill = document.getElementById('streamStatusPill');
    const streamDot = document.getElementById('streamDot');
    const streamStatusText = document.getElementById('streamStatusText');
    const serverInfoText = document.getElementById('serverInfoText');

    let currentFontSizeScale = 1.0;

    // Stream Client Setup
    const streamClient = new StreamClient(config.baseURL, {
      onEvent: (url, data) => {
        store.ingestStreamEvent(url, data);
      },
      onStatusChange: (status) => {
        updateStreamUI(status);
      },
      onError: (err) => {
        console.warn('Stream status:', err.message);
      }
    });

    function updateStreamUI(status) {
      streamDot.className = 'live-dot';
      if (status === 'connected') {
        streamDot.classList.add('connected');
        streamStatusText.textContent = 'STREAM LIVE';
        streamStatusPill.style.borderColor = 'var(--color-success)';
      } else if (status === 'reconnecting' || status === 'connecting') {
        streamDot.classList.add('streaming');
        streamStatusText.textContent = 'RECONNECTING';
        streamStatusPill.style.borderColor = 'var(--accent-orange)';
      } else {
        streamDot.classList.add('error');
        streamStatusText.textContent = 'OFFLINE';
        streamStatusPill.style.borderColor = 'var(--color-danger)';
      }
    }

    // Subscribe to Store updates
    store.subscribe('slide:status', (slideData) => {
      const cur = slideData.current?.text || '';
      const nxt = slideData.next?.text || '';
      currentSlideText.textContent = cur.trim() || '(Blank Slide)';
      nextSlideText.textContent = nxt.trim() || '--';
    });

    store.subscribe('presentation:slide_index', (data) => {
      if (data && data.index !== undefined) {
        slideIndexBadge.textContent = `SLIDE ${data.index + 1}`;
      }
    });

    store.subscribe('stage:message', (msg) => {
      if (msg && msg.trim()) {
        stageMessageText.textContent = msg;
        stageMessageBox.classList.add('has-message');
      } else {
        stageMessageText.textContent = 'No active stage message';
        stageMessageBox.classList.remove('has-message');
      }
    });

    store.subscribe('timer:video_countdown', (countdown) => {
      if (countdown && countdown !== '00:00:00' && countdown !== '00:00') {
        videoCountdownVal.textContent = countdown;
        videoCountdownBox.style.display = 'flex';
      } else {
        videoCountdownBox.style.display = 'none';
      }
    });

    // Initial Load & Stream Connect
    async function initStageMonitor() {
      serverInfoText.textContent = `${config.ip}:${config.port}`;
      try {
        const ver = await apiClient.getVersion();
        if (ver && ver.host_description) {
          serverInfoText.textContent = ver.host_description;
        }

        // Fetch initial snapshot
        const [slideSnap, msgSnap] = await Promise.all([
          apiClient.getSlideStatus().catch(() => null),
          apiClient.getStageMessage().catch(() => null)
        ]);

        if (slideSnap) {
          store.ingestStreamEvent('status/slide', slideSnap);
        }
        if (msgSnap) {
          store.ingestStreamEvent('stage/message', msgSnap);
        }
      } catch (e) {
        console.log('Initial fetch note:', e.message);
      }

      // Connect persistent chunked stream
      streamClient.connect([
        'status/slide',
        'presentation/slide_index',
        'stage/message',
        'timer/video_countdown',
        'timer/system_time'
      ]);
    }

    // System Clock
    function updateClock() {
      const now = new Date();
      clockDisplay.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Font Controls
    document.getElementById('fontIncBtn').addEventListener('click', () => {
      currentFontSizeScale = Math.min(currentFontSizeScale + 0.15, 1.8);
      applyFontSize();
    });
    document.getElementById('fontDecBtn').addEventListener('click', () => {
      currentFontSizeScale = Math.max(currentFontSizeScale - 0.15, 0.7);
      applyFontSize();
    });
    function applyFontSize() {
      currentSlideText.style.fontSize = `calc(clamp(28px, 5.5vw, 68px) * ${currentFontSizeScale})`;
      nextSlideText.style.fontSize = `calc(clamp(20px, 3.6vw, 42px) * ${currentFontSizeScale})`;
    }

    // Fullscreen Toggle
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // QR Code Modal
    const qrModal = document.getElementById('qrModal');
    document.getElementById('qrBtn').addEventListener('click', () => {
      const currentUrl = window.location.href;
      const qrContainer = document.getElementById('qrcodeDisplay');
      qrContainer.innerHTML = '';
      if (typeof QRCode !== 'undefined') {
        new QRCode(qrContainer, {
          text: currentUrl,
          width: 220,
          height: 220,
          colorDark: "#ffb300",
          colorLight: "#000000",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
      qrModal.style.display = 'flex';
    });
    document.getElementById('closeQrBtn').addEventListener('click', () => {
      qrModal.style.display = 'none';
    });

    window.addEventListener('DOMContentLoaded', initStageMonitor);
  </script>
</body>
</html>

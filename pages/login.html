<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPresenter Control</title>
    
    <link rel="icon" type="image/jpg" href="/src/Propresenter.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <div class="container-fluid bg-image d-flex align-items-center justify-content-end">
        <div class="login-card me-5">
            <h5 class="mb-4">Connect to ProPresenter</h5>

            <form id="connectionForm">
                <div class="mb-3">
                    <label class="form-label text-light">IP Address</label>
                    <input type="text" class="form-control" id="ipAddress" placeholder="Enter IP Address" value="192.168.1.11">
                </div>

                <div class="mb-4">
                    <label class="form-label text-light">Port</label>
                    <input type="number" class="form-control" id="port" placeholder="Enter Port" value="1025">
                </div>

                <button type="submit" class="btn btn-connect w-100 py-2" id="connectBtn">
                    Connect
                </button>
            </form>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>

</html>

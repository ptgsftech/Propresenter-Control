<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProPresenter Web Studio Controller</title>
  <script>
    (function() {
      const isConnected = localStorage.getItem('proPresenterConnected') === 'true';
      const urlParams = new URLSearchParams(window.location.search);
      const bypass = urlParams.get('bypass') === 'true';
      if (isConnected || bypass) {
        window.location.replace("pages/index.html" + window.location.search);
      } else {
        window.location.replace("pages/login.html" + window.location.search);
      }
    })();
  </script>
</head>
<body style="background: #0f1013; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center; max-width: 400px; padding: 24px; background: rgba(24, 26, 32, 0.95); border: 1px solid #2d3139; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);">
    <h3 style="margin-top: 0; color: #ff9f0a;">ProPresenter Web Studio</h3>
    <p style="color: #9aa0a6; font-size: 14px; margin-bottom: 20px;">Routing to your requested studio interface...</p>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <a href="pages/index.html?bypass=true" style="display: block; padding: 10px 16px; background: #ff9f0a; color: #000; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px;">Open Studio Controller (Website)</a>
      <a href="pages/login.html" style="display: block; padding: 10px 16px; background: #222630; color: #ff9f0a; text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 14px; border: 1px solid #3d424e;">Connection Settings / Login</a>
    </div>
  </div>
</body>
</html>
